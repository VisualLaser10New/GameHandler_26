name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-unit-it:
    name: Build + Unit + IT (H2, no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('gamehandler-platform/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Install reactor (skip tests)
        run: mvn -B -f gamehandler-platform/pom.xml install -DskipTests
      - name: Central unit + IT (surefire + failsafe on H2/WireMock)
        run: mvn -B -f gamehandler-platform/pom.xml verify -pl central-system
      - name: Local unit (surefire on H2/WireMock)
        run: mvn -B -f gamehandler-platform/pom.xml test -pl local-server

  e2e:
    name: E2E (embedded Moquette, no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-e2e-${{ hashFiles('gamehandler-platform/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: E2E suite (rebuild upstream + run *Test.java)
        run: mvn -B -f gamehandler-platform/pom.xml test -pl e2e-tests -am
        timeout-minutes: 20

  docker-smoke:
    name: Docker build smoke (no push)
    runs-on: ubuntu-latest
    needs: build-unit-it
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('gamehandler-platform/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Build artifacts (Dockerfiles consume target/*.jar)
        run: mvn -B -f gamehandler-platform/pom.xml package -DskipTests
      - name: Build central-system image
        run: docker build -t gh-central:ci -f gamehandler-platform/central-system/Dockerfile gamehandler-platform
      - name: Build local-server image
        run: docker build -t gh-local:ci -f gamehandler-platform/local-server/Dockerfile gamehandler-platform