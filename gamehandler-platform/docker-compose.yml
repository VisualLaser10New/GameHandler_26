version: '3.8'

services:
  # ============================================
  # INFRASTRUTTURA CENTRALE
  # ============================================
  central-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CENTRAL_DB_PASSWORD:-root}
      MYSQL_DATABASE: central_db
    ports:
      - "3306:3306"
    volumes:
      - ./infrastructure/mysql-central/init.sql:/docker-entrypoint-initdb.d/init.sql
      - central-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - central-net

  central-system:
    build:
      context: ./central-system
      dockerfile: Dockerfile
    depends_on:
      central-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://central-db:3306/central_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${CENTRAL_DB_PASSWORD:-root}
      - JWT_PRIVATE_KEY_PATH=file:/certs/private.pem
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SSL_KEYSTORE_PATH=file:/certs/central-system-https.p12
      - SSL_KEYSTORE_PASSWORD=changeit
      - SSL_TRUSTSTORE_PATH=file:/certs/local-truststore.p12
      - SSL_TRUSTSTORE_PASSWORD=changeit
    volumes:
      - ./infrastructure/tls:/certs:ro
    networks:
      - central-net
      - integration-net

  # ============================================
  # INFRASTRUTTURA LOCALE (Edificio 1)
  # ============================================
  local-db-1:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:-root}
      MYSQL_DATABASE: local_db
    ports:
      - "3307:3306"
    volumes:
      - ./infrastructure/mysql-local/init.sql:/docker-entrypoint-initdb.d/init.sql
      - local-db-1-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - local-net-1

  mqtt-broker-1:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infrastructure/mosquitto/certs:/mosquitto/certs:ro
    ports:
      - "8883:8883"
      - "1883:1883"
    networks:
      - local-net-1

  local-server-1:
    build:
      context: ./local-server
      dockerfile: Dockerfile
    depends_on:
      local-db-1:
        condition: service_healthy
      mqtt-broker-1:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "8081:8081"
    environment:
      - BUILDING_ID=building-1
      - PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://local-db-1:3306/local_db
      - MQTT_BROKER_URL=ssl://mqtt-broker-1:8883
      - MQTT_USERNAME=local-server-1
      - MQTT_PASSWORD=localserver_password
      - CENTRAL_SYSTEM_URL=https://central-system:8080
      - SYNC_INTERVAL_MS=300000
      - HEALTHCHECK_INTERVAL_MS=300000
      - JWT_LOCAL_PRIVATE_KEY_PATH=file:/certs/local-private.pem
      - JWT_LOCAL_PUBLIC_KEY_PATH=file:/certs/local-public.pem
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SSL_KEYSTORE_PATH=file:/certs/local-server-https.p12
      - SSL_KEYSTORE_PASSWORD=changeit
      - SSL_TRUSTSTORE_PATH=file:/certs/central-truststore.p12
      - SSL_TRUSTSTORE_PASSWORD=changeit
      - MQTT_TRUSTSTORE_PATH=file:/certs/local-truststore.p12
      - MQTT_TRUSTSTORE_PASSWORD=changeit
      - MQTT_KEYSTORE_PATH=file:/certs/local-server-https.p12
      - MQTT_KEYSTORE_PASSWORD=changeit
      - CA_CERT_PATH=file:/mosquitto/certs/ca.crt
      - CA_KEY_PATH=file:/mosquitto/certs/ca.key
    volumes:
      - ./infrastructure/tls:/certs:ro
      - ./infrastructure/mosquitto/certs:/mosquitto/certs:ro
    networks:
      - local-net-1
      - integration-net

  # ============================================
  # EMULATORI CLIENT (Endpoint)
  # ============================================
  game-client-1:
    build:
      context: ./game-client-emulator
      dockerfile: Dockerfile
    depends_on:
      - mqtt-broker-1
      - local-server-1
    environment:
      - GAME_ID=game-foosball-1
      - GAME_TYPE=FOOSBALL
      - BUILDING_ID=building-1
      - MQTT_BROKER_URL=ssl://mqtt-broker-1:8883
      - LOCAL_SERVER_URL=https://local-server-1:8081
      - MQTT_USERNAME=client-foosball-1
      - MQTT_PASSWORD=${GAME_CLIENT_MQTT_PASSWORD}
    networks:
      - local-net-1

  game-client-2:
    build:
      context: ./game-client-emulator
      dockerfile: Dockerfile
    depends_on:
      - mqtt-broker-1
      - local-server-1
    environment:
      - GAME_ID=game-chess-1
      - GAME_TYPE=CHESS
      - BUILDING_ID=building-1
      - MQTT_BROKER_URL=ssl://mqtt-broker-1:8883
      - LOCAL_SERVER_URL=https://local-server-1:8081
      - MQTT_USERNAME=client-chess-1
      - MQTT_PASSWORD=${GAME_CLIENT_MQTT_PASSWORD}
    networks:
      - local-net-1

volumes:
  central-db-data:
  local-db-1-data:
  mqtt-broker-1-data:     # Persistenza messaggi MQTT (QoS 1 in-flight al crash del broker)

networks:
  central-net:
  local-net-1:
  integration-net:
