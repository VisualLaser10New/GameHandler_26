spring:
  application:
    name: local-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/local_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8080

app:
  building-id: ${BUILDING_ID:building-1}
  central-system-url: ${CENTRAL_SYSTEM_URL:http://localhost:8080}
  sync-interval-ms: ${SYNC_INTERVAL_MS:300000}
  healthcheck-interval-ms: ${HEALTHCHECK_INTERVAL_MS:300000}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}

jwt:
  local-private-key-path: ${JWT_LOCAL_PRIVATE_KEY_PATH:classpath:local-private.pem}
  local-public-key-path: ${JWT_LOCAL_PUBLIC_KEY_PATH:classpath:local-public.pem}

internal:
  api-key: ${INTERNAL_API_KEY:secret}
