spring:
  main:
    allow-circular-references: true
  application:
    name: local-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/local_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: ${PORT:8181}
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:classpath:local-server-https.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: local-server-https

app:
  building-id: ${BUILDING_ID:building-1}
  local-base-url: ${LOCAL_BASE_URL:https://local-server-1:8181}
  central-system-url: ${CENTRAL_SYSTEM_URL:https://localhost:8180}
  sync-interval-ms: ${SYNC_INTERVAL_MS:5000}
  healthcheck-interval-ms: ${HEALTHCHECK_INTERVAL_MS:300000}
  dlq-promotion-interval-ms: ${DLQ_PROMOTION_INTERVAL_MS:600000}
  outbox-purge-retention-days: ${OUTBOX_PURGE_RETENTION_DAYS:7}
  outbox-purge-interval-ms: ${OUTBOX_PURGE_INTERVAL_MS:86400000}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}

ssl:
  trust-store: ${SSL_TRUSTSTORE_PATH:classpath:central-truststore.p12}
  trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
  ca-cert-path: ${CA_CERT_PATH:classpath:ca.crt}
  ca-key-path: ${CA_KEY_PATH:classpath:ca.key}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  trust-store: ${MQTT_TRUSTSTORE_PATH:classpath:local-truststore.p12}
  trust-store-password: ${MQTT_TRUSTSTORE_PASSWORD:changeit}
  key-store: ${MQTT_KEYSTORE_PATH:}
  key-store-password: ${MQTT_KEYSTORE_PASSWORD:}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}

jwt:
  local-private-key-path: ${JWT_LOCAL_PRIVATE_KEY_PATH:classpath:local-private.pem}
  local-public-key-path: ${JWT_LOCAL_PUBLIC_KEY_PATH:classpath:local-public.pem}

internal:
  api-key: ${INTERNAL_API_KEY:secret}

# Actuator — expose only the health endpoint for Docker healthchecks (GET /actuator/health).
# Only "health" is exposed on the web to keep the actuator surface minimal.
management:
  endpoints:
    web:
      exposure:
        include: health
