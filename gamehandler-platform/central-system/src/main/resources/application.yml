spring:
  application:
    name: central-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/central_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8080
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:classpath:central-system-https.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: central-system-https

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:private.pem}
  # Token lifetime in milliseconds. Default: 86 400 000 ms = 24 hours.
  # Override via JWT_EXPIRATION_MS environment variable or directly in this file.
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

internal:
  api-key: ${INTERNAL_API_KEY:secret}

central:
  replication:
    connect-timeout-ms: ${CENTRAL_REPLICATION_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CENTRAL_REPLICATION_READ_TIMEOUT_MS:5000}

# CORS allowed origins (comma-separated list, or '*' for wildcard without credentials).
# Default: http://localhost:3000 for local development.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
