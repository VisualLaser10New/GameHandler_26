spring:
  datasource:
    url: jdbc:h2:mem:central_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

server:
  port: 0
  ssl:
    enabled: false

app:
  building-id: building-test
  local-base-url: https://local-test:8081
  central-system-url: https://central-test:8080
  sync-interval-ms: 999999999
  healthcheck-interval-ms: 999999999
  # M13 — prevent LocalServerHealthMonitorService from firing during ITs.
  # The threshold is left at its default (900000) because tests that seed stale
  # rows invoke monitor() directly and assert against the configured threshold.
  health:
    monitor-interval-ms: 999999999
  # M4 — prevent UserReplicationReconciliationService from firing during central
  # integration tests. The reconciliation job is invoked directly by the IT when
  # needed (no reliance on the @Scheduled cadence).
  reconciliation:
    interval-ms: 999999999

internal:
  api-key: test-key

jwt:
  expiration-ms: 3600000
  private-key-path: classpath:alt-private.pem

central:
  replication:
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

cors:
  allowed-origins: http://localhost:3000
